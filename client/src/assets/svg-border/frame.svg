<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 90 760 140" width="100%" height="100%">
  <defs>

    <!-- Metallic Crimson Fill -->
    <linearGradient id="metallicFill" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2A000B" />
        <stop offset="25%" stop-color="#590016" />
        <stop offset="45%" stop-color="#A0002B" />
        <stop offset="60%" stop-color="#590016" />
        <stop offset="80%" stop-color="#C21845" />
        <stop offset="100%" stop-color="#2A000B" />
    </linearGradient>


    <!-- Metallic Crimson Lines -->
    <linearGradient id="metallicLine" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2A000B" />
        <stop offset="50%" stop-color="#E14B70" />
        <stop offset="100%" stop-color="#430012" />
    </linearGradient>

</defs>

  <g id="metallic-frame">
    <!-- Left Decorative Accent Lines -->
    <line x1="20" y1="105" x2="150" y2="105" stroke="url(#metallicLine)" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="210" x2="80" y2="210" stroke="url(#metallicLine)" stroke-width="4" stroke-linecap="round"/>

    <!-- Main Metallic Border Shape -->
    <!-- 
      Drawn as a hollow metallic ribbon shape using a single continuous path:
      Top straight edge -> Right curved flare -> Bottom straight edge -> Left sharp angle 
    -->
    <path d="
      M 190 105 
      L 770 105 
      C 730 150, 680 200, 630 210 
      L 90 210 
      L 180 115 
      L 730 115 
      C 670 190, 650 198, 620 198 
      L 110 198 
      L 40 206 
      L 190 105 Z" 
      fill="url(#metallicFill)" 
    />
    
    <!-- Outer Stroke Layer to Give Crisp Metallic Edges -->
    <path d="
      M 190 105 
      L 770 105 
      C 730 150, 670 200, 630 210 
      L 90 210 
      Z" 
      fill="none" 
      stroke="url(#metallicLine)" 
      stroke-width="2" 
      stroke-linejoin="round"
    />
  </g>
</svg>
